name: Android CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Preparar Gradle
        run: chmod +x gradlew

      - name: Ejecutar pruebas y compilar APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: MEV-Mantenimiento-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
